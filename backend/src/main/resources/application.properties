spring.application.name=devpulse-backend
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/devpulse}
spring.datasource.username=${DB_USERNAME:devpulse_app}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}
spring.flyway.url=${DB_MIGRATION_URL:${spring.datasource.url}}
spring.flyway.user=${DB_MIGRATION_USERNAME:devpulse_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.default-schema=devpulse
spring.flyway.schemas=devpulse
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
spring.flyway.locations=classpath:db/migration
# V8 (pending_signups) is applied in existing databases, but its original script is unavailable.
spring.flyway.ignore-migration-patterns=versioned:missing

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

devpulse.supabase.url=${SUPABASE_URL:${VITE_SUPABASE_URL:}}
devpulse.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:${VITE_SUPABASE_ANON_KEY:}}
